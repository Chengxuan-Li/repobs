site_name: repobs
site_description: Local Git worktree and coding-agent observatory
site_author: repobs contributors
# GitHub Pages address; instant navigation needs it. No repo_url: Material would query the GitHub API from
# visitors' browsers (design/docs-ui-spec.md, 0.14).
site_url: https://chengxuan-li.github.io/repobs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true
# Styling follows design/docs-ui-spec.md (section 0 wins).
theme:
  name: material
  # overrides/main.html preloads the two fonts every page uses.
  custom_dir: overrides
  # No font host: docs/assets/stylesheets/fonts.css serves Geist and Geist Mono from the site.
  font: false
  favicon: assets/favicon.svg
  language: en
  features:
    # Instant navigation swaps only the page content; header, sidebars and fonts persist.
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
plugins:
  - search
nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - User guide: user-guide.md
      - Status semantics: status-semantics.md
      - Integrations: integrations.md
      - Privacy & security: privacy-security.md
      - Limitations: limitations.md
  - Reference:
      - Architecture: architecture.md
      - HTTP API: api.md
  - Development:
      - Reference audit: development/reference-audit.md
      - Testing: development/testing.md
      - Handoff progress: development/handoff-status.md
      - Product handoff (original): development/product-handoff.md
      - Foundation decision: decisions/0001-product-foundation.md
      - Engineering decisions: decisions/0002-engineering-choices.md
      - Dashboard and commit graph: decisions/0003-dashboard-commit-graph-and-excerpts.md
      - Reference UI alignment: decisions/0004-reference-ui-alignment-ribbon-docking.md
      - Views and File menu: decisions/0005-views-and-file-menu.md
      - Release packaging: decisions/0006-release-packaging.md
      - Documentation site style: decisions/0007-docs-site-alignment.md
      - Automation rules and hiding: decisions/0008-automation-rules-and-view-hiding.md
extra_css:
  - assets/stylesheets/fonts.css
  - assets/stylesheets/site.css
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
